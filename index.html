<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7fd0f5" />
    <title>Hop Across</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="danger"></div>

      <div id="hud">
        <div class="hud-left">
          <div id="best">TOP 0</div>
        </div>
        <div id="score">0</div>
        <div class="hud-right">
          <div id="coins" class="coins"><i class="coin-icon"></i><span>0</span></div>
          <button id="mute" class="icon-btn" aria-label="Toggle sound">
            <svg class="ico-on" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
            <svg class="ico-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

      <div id="start" class="overlay">
        <h1 class="title"><span>HOP</span><span>ACROSS</span></h1>
        <p class="prompt blink">Tap or press <kbd>Space</kbd> to play</p>
        <p class="hint">Arrows / WASD to hop &middot; Swipe on mobile &middot; M to mute</p>
        <button class="btn open-chars">Characters</button>
      </div>

      <div id="gameover" class="overlay hidden">
        <div class="card">
          <div class="label">SCORE</div>
          <div id="final-score" class="big">0</div>
          <div id="new-best" class="badge hidden">NEW BEST!</div>
          <div class="label">BEST <span id="final-best">0</span></div>
          <div id="run-coins" class="run-coins"></div>
        </div>
        <p class="prompt blink">Tap or press <kbd>Space</kbd> to retry</p>
        <button class="btn open-chars">Characters</button>
      </div>

      <div id="select" class="overlay hidden">
        <h2 class="select-title">CHARACTERS</h2>
        <div class="spacer"></div>
        <div class="panel no-tap">
          <div class="panel-row">
            <button id="sel-prev" class="arrow" aria-label="Previous character">&#9664;</button>
            <div class="sel-info">
              <div id="sel-name" class="sel-name">Bolt</div>
              <div id="sel-blurb" class="sel-blurb"></div>
              <div id="sel-count" class="sel-count">1 / 5</div>
            </div>
            <button id="sel-next" class="arrow" aria-label="Next character">&#9654;</button>
          </div>
          <button id="sel-go" class="btn primary">PLAY</button>
          <button id="sel-close" class="btn ghost">Back</button>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
